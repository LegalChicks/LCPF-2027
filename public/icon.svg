<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="eggGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer background circle/shield -->
  <rect width="512" height="512" rx="128" fill="url(#shieldGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.6" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Farm Emblem Graphics: Egg nestled with hatching chick & wheat sheaves -->
  <g filter="url(#glow)">
    <!-- Wheat Laurel Left -->
    <path d="M120 340 C100 280, 110 200, 160 140 C155 170, 140 220, 145 280 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M110 280 C90 260, 80 220, 105 180 C115 205, 120 240, 110 280 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Wheat Laurel Right -->
    <path d="M392 340 C412 280, 402 200, 352 140 C357 170, 372 220, 367 280 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M402 280 C422 260, 432 220, 407 180 C397 205, 392 240, 402 280 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Center Giant Golden Egg -->
    <path d="M256 120 C180 120, 140 210, 140 300 C140 375, 190 420, 256 420 C322 420, 372 375, 372 300 C372 210, 332 120, 256 120 Z" fill="url(#eggGrad)" />
    
    <!-- Rooster / Chick silhouette inside egg -->
    <!-- Comb & Head -->
    <path d="M256 180 C270 170, 290 170, 298 185 C305 182, 315 188, 312 200 C322 202, 325 212, 320 220 C330 225, 328 235, 315 238 C310 260, 295 285, 275 295 C255 305, 235 300, 225 285 C215 270, 218 245, 230 230 C240 218, 250 200, 256 180 Z" fill="#064e3b" />
    <!-- Eye -->
    <circle cx="282" cy="208" r="4.5" fill="#fef3c7" />
    <!-- Beak -->
    <polygon points="315,214 332,222 315,228" fill="#d97706" />
    <!-- Wattle -->
    <path d="M295 238 C298 250, 288 258, 280 250 Z" fill="#dc2626" />
    <!-- Wing arc -->
    <path d="M235 245 Q260 275 240 295 Q255 285 265 265 Z" fill="#047857" />

    <!-- Farm Nest Straw -->
    <path d="M160 380 Q256 440 352 380 Q256 410 160 380 Z" fill="#b45309" />
  </g>

  <!-- Typography Banner -->
  <rect x="80" y="420" width="352" height="42" rx="21" fill="#022c22" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#fde68a" letter-spacing="2.5">LEGAL CHICKS FARM</text>
  <text x="256" y="478" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#a7f3d0" letter-spacing="1.5">SOLANA, CAGAYAN • PH</text>
</svg>
